name: tarific

services:
  mcp-chatbot-backend:
    container_name: mcp-chatbot-backend
    build:
      context: ../MCP-client
      dockerfile: Dockerfile.dev
      args:
        BASE_URL: "http://mcp-server-backend:8000"
    expose:
      - "8001"
    env_file:
      - ../MCP-client/.env
    depends_on:
      mcp-server-backend:
        condition: service_healthy
    restart: on-failure
    networks:
      - tariff-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://mcp-chatbot-backend:8001/chat/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mcp-gateway-backend:
    container_name: mcp-gateway-backend
    build:
      context: ../MCP-Gateway
      dockerfile: Dockerfile.dev
      args:
        BASE_URL: "http://mcp-server-backend:8000"
    expose:
      - "8090"
    env_file:
      - ../MCP-Gateway/.env
    restart: on-failure
    networks:
      - tariff-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://mcp-gateway-backend:8090/mcp/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mcp-server-backend:
    container_name: mcp-server-backend
    build:
      context: ../MCP-Server
      dockerfile: Dockerfile.dev
    expose:
      - "8000"
    env_file:
      - ../MCP-Server/.env
    restart: on-failure
    networks:
      - tariff-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://mcp-server-backend:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  tariff-backend:
    container_name: tariff-backend
    build:
      context: ../tariff-backend
      dockerfile: Dockerfile.dev
    expose:
      - "8080"
    env_file:
      - ../tariff-backend/.env
    restart: on-failure
    networks:
      - tariff-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://tariff-backend:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
   
  tariff-frontend:
    container_name: tariff-frontend
    build:
      context: ../tariff-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      tariff-backend:
        condition: service_healthy
      mcp-gateway-backend:
        condition: service_healthy
      mcp-chatbot-backend:
        condition: service_healthy
    networks:
      - tariff-network

networks:
  tariff-network:
    driver: bridge
