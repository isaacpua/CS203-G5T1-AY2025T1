name: TARIFIC

services:
  backend:
    container_name: tariff-backend
    build:
      context: ../tariff-backend
      dockerfile: Dockerfile.dev
    expose:
      - "8080"
    env_file:
      - ../tariff-backend/.env
    restart: on-failure
    networks:
      - tariff-network
   
  nginx:
    container_name: tariff-frontend
    build:
      context: ../tariff-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - tariff-network

networks:
  tariff-network:
    driver: bridge
