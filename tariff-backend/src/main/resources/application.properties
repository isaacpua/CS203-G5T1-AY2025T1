spring.application.name=tariff-backend

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
## Disable verbose SQL logging; set to true only when debugging queries
spring.jpa.show-sql=false
## Reduce logging verbosity for Hibernate and Spring Data pagination warning
logging.level.org.hibernate=INFO
logging.level.org.springframework.data.web=INFO
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=tariffs

#Historical data configuration
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
# JWT Configuration
## JWT secret. Use environment variable JWT_SECRET in production. A long default is provided for local dev and CI
## NOTE: change this in production! The key must be sufficiently long for the HMAC algorithm.
jwt.secret=${JWT_SECRET:VerySecretDevKey_ChangeMe_in_Prod_UseEnvVar_0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ}
# 1 day in milliseconds
jwt.expiration=86400000
# 1 minute in milliseconds for testing
# jwt.expiration=60000
