# This tells the H2 test database to be compatible with PostgreSQL SQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

# This ensures the schema is created and dropped for each test run
spring.jpa.hibernate.ddl-auto=create-drop

# This ensures the dialect matches the PostgreSQL mode
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# This property was missing for your JwtService
jwt.expiration=86400000

# --- ADD THESE TWO LINES ---
spring.datasource.username=sa
spring.datasource.password=password